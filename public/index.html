<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOL metrics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root { --bg:#f4f6f8; --panel:#fff; --ink:#1b2430; --muted:#5d6b7a; --line:#d9e0e7; --accent:#0e6b62; --err:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  textarea, input { width:100%; border:1px solid var(--line); border-radius:6px; padding:10px 12px; font:inherit; background:var(--panel); color:inherit; }
  textarea { min-height: 160px; resize: vertical; }
  textarea:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  label { display:block; font-weight:600; margin: 0 0 6px; }
  .bar { display:flex; gap:12px; align-items:end; margin-top:12px; flex-wrap:wrap; }
  .bar .pw { width:220px; }
  button { border:0; border-radius:6px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; background:var(--accent); color:#fff; }
  button.alt { background:var(--panel); color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #msg { margin: 18px 0 8px; color: var(--muted); min-height: 1.5em; }
  #msg.err, .note.err { color: var(--err); }
  .note { color: var(--muted); font-size: 14px; margin: 2px 0; }
  .wrap { overflow-x:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-top:12px; }
  table { border-collapse: collapse; width:100%; min-width: 720px; }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { font-weight:600; background:#eef2f5; }
  td.n, th.n { text-align:right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom:0; }
  td a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>KOL metrics</h1>
  <p class="sub">Paste post links, one per line. Works for TikTok, Instagram, Facebook and YouTube.</p>

  <label for="links">Post links</label>
  <textarea id="links" placeholder="https://www.tiktok.com/@handle/video/…&#10;https://www.instagram.com/reel/…"></textarea>

  <div class="bar">
    <div class="pw"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button id="go">Pull metrics</button>
    <button id="dl" class="alt" disabled>Download Excel</button>
  </div>

  <div id="msg" role="status"></div>
  <div id="notes"></div>
  <div class="wrap" id="tablewrap" hidden>
    <table>
      <thead><tr>
        <th>KOL handle</th><th>Platform</th><th>Date posted</th><th class="n">Days active</th>
        <th class="n">Likes</th><th class="n">Comments</th><th class="n">Shares / reposts</th><th>Post</th>
      </tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let rows = [], notes = [], pulledOn = new Date();
$("pw").value = sessionStorage.getItem("pw") || "";

async function api(path, body) {
  const r = await fetch(path, {
    method: "POST",
    headers: { "content-type": "application/json", "x-app-password": $("pw").value },
    body: JSON.stringify(body),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}

function daysActive(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  const t = pulledOn;
  return Math.max(0, Math.round((Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) - Date.UTC(y, m - 1, d)) / 864e5));
}

function say(text, err) { $("msg").textContent = text; $("msg").className = err ? "err" : ""; }

function render() {
  $("tablewrap").hidden = !rows.length;
  $("dl").disabled = !rows.length;
  const body = $("body"); body.innerHTML = "";
  for (const r of rows) {
    const tr = document.createElement("tr");
    const cells = [r.handle, r.platform, r.datePosted, daysActive(r.datePosted), r.likes, r.comments, r.shares];
    cells.forEach((v, i) => {
      const td = document.createElement("td");
      if (i >= 3) td.className = "n";
      td.textContent = v ?? "";
      tr.appendChild(td);
    });
    const td = document.createElement("td");
    if (r.postUrl) { const a = document.createElement("a"); a.href = r.postUrl; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Open"; td.appendChild(a); }
    tr.appendChild(td); body.appendChild(tr);
  }
  $("notes").innerHTML = "";
  for (const n of notes.filter(Boolean)) {
    const p = document.createElement("p"); p.className = "note err"; p.textContent = n; $("notes").appendChild(p);
  }
}

$("go").onclick = async () => {
  const links = $("links").value.split(/\s+/).filter(Boolean);
  if (!links.length) return say("Paste at least one link.", true);
  sessionStorage.setItem("pw", $("pw").value);
  rows = []; notes = []; pulledOn = new Date(); render();
  $("go").disabled = true; say("Starting…");
  try {
    const s = await api("/api/start", { links });
    rows = s.rows; notes = [...s.errors];
    if (s.skipped.length) notes.push(`${s.skipped.length} link(s) skipped: unrecognized platform or over the per-platform limit.`);
    let pending = s.runs;
    while (pending.length) {
      say(`Waiting on ${pending.length} Apify run(s)…`); render();
      await new Promise((r) => setTimeout(r, 5000));
      const { results } = await api("/api/status", { runs: pending });
      const still = [];
      for (const res of results) {
        const run = pending.find((p) => p.runId === res.runId);
        if (res.state === "running") still.push(run);
        else if (res.state === "failed") notes.push(`${run.platform}: Apify run ${res.error}.`);
        else { rows.push(...res.rows); console.log(run.platform, "first raw item:", res.sample); }
      }
      pending = still;
    }
    say(`Done. ${rows.length} post(s) pulled.`);
  } catch (e) { say(e.message, true); }
  $("go").disabled = false; render();
};

$("dl").onclick = () => {
  const data = rows.map((r) => ({
    "KOL handle": r.handle, "Platform": r.platform, "Date posted": r.datePosted,
    "Days active": daysActive(r.datePosted), "Likes": r.likes, "Comments": r.comments,
    "Shares / reposts": r.shares, "Post URL": r.postUrl,
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws["!cols"] = [22, 12, 12, 11, 10, 10, 15, 50].map((wch) => ({ wch }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "KOL metrics");
  XLSX.writeFile(wb, `kol-metrics-${pulledOn.toISOString().slice(0, 10)}.xlsx`);
};
</script>
</body>
</html>
